<main>
    <div>
        <p-button label="Adicionar" (click)="_utilService.navegation('/pessoas/cadastrar')"/>
    </div>
    
    <p-toast></p-toast>
    <p-table [value]="peopleList" dataKey="id" editMode="row" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="caption">
            Pessoas
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width:20%">Nome</th>
                <th style="width:20%">CPF</th>
                <th style="width:20%">E-mail</th>
                <th style="width:20%">Escola</th>
                <th style="width:20%">Endereço</th>
                <th style="width:20%"></th>
                <th style="width:20%"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-peopleList let-editing="editing" let-ri="rowIndex">
            <tr [pEditableRow]="peopleList">
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input 
                                pInputText 
                                type="text" 
                                [(ngModel)]="peopleList.name" />
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{peopleList.name}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input 
                                pInputText type="text" 
                                [(ngModel)]="peopleList.cpf"
                                maxlength="11"
                                required />
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{peopleList.cpf}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input 
                                pInputText type="text" 
                                [(ngModel)]="peopleList.email" 
                                required />
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{peopleList.email}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input 
                                pInputText 
                                type="text" 
                                [(ngModel)]="peopleList.school" />
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{peopleList.school}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input 
                                pInputText 
                                type="text" 
                                [(ngModel)]="peopleList.city" />
                        </ng-template>
                        <ng-template pTemplate="output">
                            {{peopleList.city}}
                        </ng-template>
                    </p-cellEditor>
                </td>
                <td>
                    <div class="flex align-items-center justify-content-center gap-2">
                        <button 
                            *ngIf="!editing" 
                            pButton 
                            pRipple 
                            type="button" 
                            pInitEditableRow 
                            icon="pi pi-pencil" 
                            (click)="onRowEditInit(peopleList)" 
                            class="p-button-rounded p-button-text">
                        </button>
                        <button 
                            *ngIf="editing" 
                            pButton 
                            pRipple 
                            type="button" 
                            pSaveEditableRow 
                            icon="pi pi-check" 
                            (click)="onRowEditSave(peopleList)" 
                            class="p-button-rounded p-button-text p-button-success mr-2">
                        </button>
                        <button 
                            *ngIf="editing" 
                            pButton pRipple 
                            type="button" 
                            pCancelEditableRow 
                            icon="pi pi-times" 
                            (click)="onRowEditCancel(peopleList, ri)" 
                            class="p-button-rounded p-button-text p-button-danger">
                        </button>
                    </div>
                </td>
                <td>
                    <button 
                        *ngIf="!editing" 
                        pButton 
                        pRipple 
                        type="button"
                        icon="pi pi-trash" 
                        (click)="deletePeople(peopleList)" 
                        class="p-button-rounded p-button-text">
                    </button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</main>
