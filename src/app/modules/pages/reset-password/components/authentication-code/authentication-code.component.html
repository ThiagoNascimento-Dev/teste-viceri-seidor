<p-card header="Esqueci a senha">
    <form [formGroup]="codeForm" (submit)="onSubmit()" class="flex flex-column align-items-center">
        <div class="font-bold text-xl mb-2">Valide seu código</div>
        <p class="text-color-secondary block mb-5">Informe o código enviado no email!</p>
        <p-inputOtp [length]="6" style="gap: 0">
            <ng-template pTemplate="input" let-token let-events="events" let-index="index">
                <input 
                    pInputText
                    type="text" 
                    [maxLength]="1" 
                    (input)="events.input($event)" 
                    (keydown)="events.keydown($event)"
                    (paste)="events.paste($event)"
                    [attr.value]="token" 
                    class="custom-otp-input"
                    formControlName="code"/>
                <div *ngIf="index === 3" class="px-3">
                    <i class="pi pi-minus"></i>
                </div>
            </ng-template>
        </p-inputOtp>
        <div class="flex justify-content-between mt-5 align-self-stretch">
            <p-button label="Reenviar código" [link]="true" class="p-0" (click)="backToEmail()"/>
            <p-button type="submit" label="Validar" [disabled]="codeForm.invalid"/><!--(click)="btnSendCode()"-->
        </div>
    </form>
</p-card>
