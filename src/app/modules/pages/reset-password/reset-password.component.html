<p-button class="btn-teste" label="Login" (click)="_utilService.navegation('/login')"/>
<app-email
    *ngIf="showEmail"
    (sendEmail)="checkEmail($event)"
/>
<app-authentication-code
    *ngIf="showAuthentication"
    (sendCode)="checkCode($event)"
    (backEmail)="resendEmail($event)"
/>
<app-new-password
    *ngIf="showNewPassword"
/>
